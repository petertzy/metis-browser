name: Desktop Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Install application dependencies
        run: npm install
      - name: Launch browser and verify toolbar
        env:
          METIS_SMOKE_TEST: '1'
        run: timeout 90s xvfb-run -a npm start
